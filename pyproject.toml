[project]
name = "clipper"
version = "0.1.0"
description = "LibreClipper: turn podcasts into captioned vertical clips, on your own computer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yuki Tanaka" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "certifi>=2024.8.30",
    "faster-whisper>=1.2.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mediapipe>=0.10.35,<1.0",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scenedetect>=0.7.1",
    "scipy>=1.17.1",
    "uvicorn>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.urls]
Repository = "https://github.com/yukitanakachez/libreclipper"
Issues = "https://github.com/yukitanakachez/libreclipper/issues"

[project.scripts]
clipper = "clipper.cli:main"

[project.optional-dependencies]
pc = [
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.pytest.ini_options]
markers = ["live: hits the network and costs money (deselected by default)"]
addopts = "-m 'not live' --ignore-glob='* [0-9].py'"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fonttools>=4.65.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
