name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: macos-14          # Apple Silicon, the system Clipper is built for
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # The render tests need a real ffmpeg with libass and the fixture video.
      - run: .venv/bin/python -c "from clipper import provision; provision.ensure()"
      - run: .venv/bin/python tests/fixtures/make_fixtures.py
      - run: .venv/bin/python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
