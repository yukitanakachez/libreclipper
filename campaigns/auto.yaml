# Any video. Clipper can't tell whose a video file is, so this adds no creator credit and no
# creator hashtag. To credit a creator (and set vocabulary, music or hashtags), copy
# example.yaml to campaigns/<creator>.yaml.
name: Any video (no creator credit)
credit: { enabled: true, handle: auto, position: below_headline }
clip_length: { min: 20, max: 60 }
required_hashtags: [auto]
headline: { enabled: true }
music: { allowed: false }
captions: { accent_color: "#FFE500", uppercase: false }
