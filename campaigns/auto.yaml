# Any video. The credit and the creator's hashtag come from the Creator box you fill in when
# starting a job (or --creator on the command line); leave it empty for no credit. Use a named
# campaign when a creator needs something specific (vocabulary, music, extra hashtags).
name: Any video
credit: { enabled: true, handle: auto, position: below_headline }
clip_length: { min: 20, max: 60 }
required_hashtags: [auto]
headline: { enabled: true }
music: { allowed: false }
captions: { accent_color: "#FFE500", uppercase: false }
